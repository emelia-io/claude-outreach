name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check skills and agents
        run: python3 tests/run.py
